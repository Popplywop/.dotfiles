<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Iosevka Nerd Font</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Iosevka Nerd Font</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Iosevka Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
