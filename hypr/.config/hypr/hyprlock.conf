# hyprlock config — Gruber Darker
# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = rgba(24, 24, 24, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(9e95c7)
    inner_color = rgb(181818)
    font_color = rgb(e4e4ef)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgb(73c936)
    fail_color = rgb(f43841)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(ffdd33)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(228, 228, 239, 0.9)
    font_size = 72
    font_family = monospace Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(150, 166, 200, 0.8)
    font_size = 20
    font_family = monospace
    position = 0, 110
    halign = center
    valign = center
}
