set -g mouse on
set -gq allow-passthrough on  # kitty graphics protocol passthrough (yazi image preview)
set -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -s set-clipboard on
set -g focus-events on

# Copy/paste
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind v paste-buffer

unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind x kill-pane
bind z resize-pane -Z
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Tab (window) keybinds
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind Tab last-window
bind w choose-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind X kill-window
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9

# ── Status Bar ──────────────────────────────────────────────────────────────
# ── Colors ── edit these to retheme everything ──────────────────
set -g @cl_bg     "#181818"
set -g @cl_bg2    "#252525"
set -g @cl_pill   "#3c3c3c"
set -g @cl_green  "#95cc5e"
set -g @cl_yellow "#ffdd33"
set -g @cl_red    "#f43841"
set -g @cl_blue   "#96a6c8"
set -g @cl_purple "#9e95c7"
set -g @cl_fg     "#cccccc"

set -g status on
set -g status 2
set -g status-format[1] "#[fill=#{@cl_bg}]"
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=#{@cl_bg}"
set -g message-style "bg=#{@cl_blue},fg=#{@cl_bg}"
set -g message-command-style "bg=#{@cl_blue},fg=#{@cl_bg}"
set -g mode-style "bg=#{@cl_yellow},fg=#{@cl_bg},bold"

set -g pane-border-style "fg=#353535"
set -g pane-active-border-style "fg=#{@cl_green}"

set -as terminal-overrides ',*:UTF-8:ambw=single'

set -g status-left-length 60
set -g status-left " #[fg=#{@cl_green}]#[bg=#{@cl_bg}]#[fg=#{@cl_bg}]#[bg=#{@cl_green}]  #S #[fg=#{@cl_green}]#[bg=#{@cl_bg}]"

setw -g window-status-separator ""
setw -g window-status-style "default"
setw -g window-status-format " #[fg=#{@cl_pill}]#[bg=#{@cl_bg}]#[fg=#{@cl_purple}]#[bg=#{@cl_pill}] #I  #W #[fg=#{@cl_pill}]#[bg=#{@cl_bg}]"
setw -g window-status-current-style "default"
setw -g window-status-current-format " #{?client_prefix,#[fg=#{@cl_red}]#[bg=#{@cl_bg}]#[fg=#{@cl_bg}]#[bg=#{@cl_red}]#[bold] #I  #W #[fg=#{@cl_red}]#[bg=#{@cl_bg}]#[nobold],#[fg=#{@cl_yellow}]#[bg=#{@cl_bg}]#[fg=#{@cl_bg}]#[bg=#{@cl_yellow}]#[bold] #I  #W #[fg=#{@cl_yellow}]#[bg=#{@cl_bg}]#[nobold]}"
setw -g window-status-bell-style "bg=#{@cl_red},fg=#{@cl_bg},bold"

set -g status-right-length 120
set -g status-right "#[fg=#{@cl_bg2}]#[bg=#{@cl_bg}]#[fg=#{@cl_purple}]#[bg=#{@cl_bg2}]  #h #[fg=#{@cl_bg2}]#[bg=#{@cl_bg}]  #[fg=#{@cl_blue}]#[bg=#{@cl_bg}]#[fg=#{@cl_bg}]#[bg=#{@cl_blue}]  %d %b %Y #[fg=#{@cl_blue}]#[bg=#{@cl_bg}]  #[fg=#{@cl_yellow}]#[bg=#{@cl_bg}]#[fg=#{@cl_bg}]#[bg=#{@cl_yellow}]  %H:%M:%S #[fg=#{@cl_yellow}]#[bg=#{@cl_bg}] "
