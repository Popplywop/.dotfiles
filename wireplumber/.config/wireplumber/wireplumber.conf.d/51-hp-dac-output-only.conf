# HP-DAC1 is a full-speed USB device behind several hubs. Opening its output
# and input together (the default duplex profile, both 24-bit) exceeds the
# available isochronous bandwidth: "Not enough bandwidth for altsetting 2",
# and the card never starts. The input is unused, so don't create that node.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-SOUNDAVO_HP-DAC1-01.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
