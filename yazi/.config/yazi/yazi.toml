[mgr]
ratio          = [1, 2, 4]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size     = 2
max_width    = 600
max_height   = 900
image_filter = "triangle"
image_quality = 75

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "nvim" },
]
open = [
  { run = 'xdg-open "$@"', orphan = true, desc = "open" },
]
play = [
  { run = 'mpv "$@"', orphan = true, desc = "mpv" },
]
extract = [
  { run = 'unar "$1"', desc = "extract here" },
]

[open]
rules = [
  # Text / code → nvim
  { mime = "text/*",                        use = ["edit", "open"] },
  { mime = "application/json",              use = ["edit", "open"] },
  { mime = "application/javascript",        use = ["edit", "open"] },
  { mime = "application/x-shellscript",     use = ["edit", "open"] },
  # Media
  { mime = "image/*",                       use = ["open"] },
  { mime = "video/*",                       use = ["play", "open"] },
  { mime = "audio/*",                       use = ["play", "open"] },
  # Archives
  { mime = "application/zip",               use = ["extract", "open"] },
  { mime = "application/gzip",              use = ["extract", "open"] },
  { mime = "application/x-tar",             use = ["extract", "open"] },
  { mime = "application/x-bzip2",           use = ["extract", "open"] },
  { mime = "application/x-7z-compressed",   use = ["extract", "open"] },
  { mime = "application/x-rar",             use = ["extract", "open"] },
  # Fallback
  { mime = "*", use = ["open"] },
]

[tasks]
micro_workers    = 5
macro_workers    = 10
bizarre_retry    = 5
image_alloc      = 536870912  # 512 MB
suppress_preload = false
